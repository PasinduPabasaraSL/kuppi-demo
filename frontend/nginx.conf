server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Vite puts a content hash in every asset filename, so these can be cached
    # hard: a new build produces new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else falls back to index.html so React Router can handle the
    # path. Without this, reloading /notes returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
